name: Update ADCB FX Rates

on:
  schedule:
    # Runs every 30 minutes. Adjust to taste (ADCB updates a few times a
    # day, so hourly or every-2-hours is also reasonable and lighter).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas lxml

      - name: Run scraper
        run: python scrape_adcb_fx.py

      - name: Commit and push if changed
        run: |
          git config user.name "fx-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rates.json
          if git diff --staged --quiet; then
            echo "No rate changes — nothing to commit."
          else
            git commit -m "Update ADCB FX rates $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
